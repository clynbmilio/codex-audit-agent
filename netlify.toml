[build]
publish = "public"
functions = "netlify/functions"

[[redirects]]
from = "/audit"
to = "/.netlify/functions/audit"
status = 200

[[redirects]]
from = "/health"
to = "/.netlify/functions/health"
status = 200

[[redirects]]
from = "/openapi.json"
to = "/.netlify/functions/openapi"
status = 200

[[redirects]]
from = "/.well-known/openapi.json"
to = "/.netlify/functions/openapi"
status = 200

[[redirects]]
from = "/.well-known/agent-card.json"
to = "/.netlify/functions/agent-card"
status = 200
